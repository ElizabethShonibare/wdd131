<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Submit your product review with ratings, installation date, useful features, and
    optional written feedback or name. A simple, responsive form designed for usability and a positive user experience.">
    <meta name="author" content="Elizabeth Shonibare">
    <title>Product Review Form</title>
   
    <link rel="stylesheet" href="styles/form.css">

    <script src="scripts/form.js" defer></script>
</head>

<body>
    <header>
        <h1>Product Review Form</h1>        
    </header>

    <form method="get" action="review.html">

        <!-- Product Name -->
        <label for="product">Product Name:</label>
        <select id="product" name="product" required>
            <option value="" disabled selected>Choose a Product ...</option>
            <!-- Options will be populated dynamically via JS -->
        </select>

        <!-- Overall Rating -->
        <fieldset>
            <legend>Overall Rating:</legend>
            <label><input type="radio" id="rating" name="rating" value="1" required> ☆</label>
            <label><input type="radio" id="rating" name="rating" value="2" required> ☆☆</label>
            <label><input type="radio" id="rating" name="rating" value="3" required> ☆☆☆</label>
            <label><input type="radio" id="rating" name="rating" value="4" required> ☆☆☆☆</label>
            <label><input type="radio" id="rating" name="rating" value="5" required> ☆☆☆☆☆</label>
        </fieldset>

        <!-- Date of Installation -->
        <label for="installDate">Date of Installation:</label>
        <input type="date" id="installDate" name="installDate" required>

        <!-- Useful Features -->
        <fieldset>
            <legend>Which features did you find useful in the product?(check all that apply)</legend>
            <label><input type="checkbox" id="features" name="features" value="Easy Setup"> Easy Setup</label>
            <label><input type="checkbox" id="features" name="features" value="Durability">Durability</label>
            <label><input type="checkbox" id="features" name="features" value="Performance">Performance</label>
            <label><input type="checkbox" id="features" name="features" value="Design">Design</label>
        </fieldset>

        <!-- Written Review -->
        <label for="review" class="optional">Written Review (Optional):</label>
        <textarea id="review" name="review" class="optional"></textarea>

        <!-- User Name -->
        <label for="username" class="optional">Your Name(Optional):</label>
        <input type="text" id="username" name="username" class="optional">

        <!-- Submit -->
        <input type="submit" value="Post Review">
    </form>

    <footer>
        <p><span id="currentyear">©️ 2026💐Elizabeth Shonibare💐Nigeria </span></p>
        <p><span id="lastModified">Last Modification</span> </p>
    </footer>
</body>

</html>
