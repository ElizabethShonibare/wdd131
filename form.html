<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review Form</title>
    <meta name="description" content="Making use and understanding the web-dynamic fundamentals">
    
    <link rel="stylesheet" href="styles/form.css">

    <script src="scripts/form.js" defer></script>
</head>

<body>
    <h1>Product Review</h1>
    <form method="get" action="review.html">

        <!-- Product Name -->
        <label for="product">Product Name:</label>
        <select id="product" name="product" required>
            <option value="" disabled selected>Choose a Product ...</option>
            <!-- Options will be populated dynamically via JS -->
        </select>

        <!-- Overall Rating -->
        <fieldset>
            <legend>Overall Rating:</legend>
            <label><input type="radio" id="rating1" name="rating" value="1" required> ☆</label>
            <label><input type="radio" id="rating2" name="rating" value="2"> ☆☆</label>
            <label><input type="radio" id="rating3" name="rating" value="3"> ☆☆☆</label>
            <label><input type="radio" id="rating4" name="rating" value="4"> ☆☆☆☆</label>
            <label><input type="radio" id="rating5" name="rating" value="5"> ☆☆☆☆☆</label>
        </fieldset>

        <!-- Date of Installation -->
        <label for="installDate">Date of Installation:</label>
        <input type="date" id="installDate" name="installDate" required>

        <!-- Useful Features -->
        <fieldset>
            <legend>Which features did you find useful in the product?(check all that apply)</legend>
            <label><input type="checkbox" id="feature1" name="features" value="Easy Setup"> Easy Setup</label>
            <label><input type="checkbox" id="feature1" name="features" value="Durability">Durability</label>
            <label><input type="checkbox" id="feature2" name="features" value="Performance">Performance</label>
            <label><input type="checkbox" id="feature3" name="features" value="Design">Design</label>
        </fieldset>

        <!-- Written Review -->
        <label for="review" class="optional">Written Review (Optional):</label>
        <textarea id="review" name="review" class="optional"></textarea>

        <!-- User Name -->
        <label for="username" class="optional">Your Name(Optional):</label>
        <input type="text" id="username" name="username" class="optional">

        <!-- Submit -->
        <input type="submit" value="Post Review">
    </form>

    <footer>
        <p><span id="currentyear">©️ 2026💐Elizabeth Shonibare💐Nigeria </span></p>
        <p><span id="lastModified">Last Modification</span> </p>
    </footer>
</body>

</html>
