<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A simple, responsive form designed for usability and a positive user experience.">
    <meta name="author" content="Elizabeth Shonibare">
    <title>Product Review Form</title>
    
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>

<body>
    <main>
        <header>
        <h1>Product Review</h1>
        </header>
        <form method="get" action="review.html">

            <!-- Product Name -->
            <label for="productName">Product Name <span class="required">*</span></label>
            <select id="productName" name="productName" required>
                <option value="" disabled selected>Select a Product ...</option>
                <!-- Options populated dynamically by JS -->
            </select>

            <!-- Overall Rating -->
            <fieldset>
                <legend>Overall Rating <span class="required">*</span></legend>
                <label for="rating1"><input type="radio" id="rating1" name="rating" value="1" required> ☆</label>
                <label for="rating2"><input type="radio" id="rating2" name="rating" value="2"> ☆☆</label>
                <label for="rating3"><input type="radio" id="rating3" name="rating" value="3"> ☆☆☆</label>
                <label for="rating4"><input type="radio" id="rating4" name="rating" value="4"> ☆☆☆☆</label>
                <label for="rating5"><input type="radio" id="rating5" name="rating" value="5"> ☆☆☆☆☆</label>
            </fieldset>

            <!-- Date of Installation -->
            <label for="installDate">Date of Installation <span class="required">*</span></label>
            <input type="date" id="installDate" name="installDate" required>

            <!-- Useful Features -->
            <fieldset>
                <legend>Which features did you find useful in the product? (Check all that apply)</legend>
                <label for="durability"><input type="checkbox" id="durability" name="features" value="Durability"> Durability</label>
                <label for="ease"><input type="checkbox" id="ease" name="features" value="Ease of Use"> Ease of Use</label>
                <label for="performance"><input type="checkbox" id="performance" name="features" value="Performance">
                    Performance</label>
                <label for="design"><input type="checkbox" id="design" name="features" value="Design"> Design</label>
            </fieldset>

            <!-- Written Review -->
            <label for="review">Written Review (Optional)</label>
            <textarea id="review" name="review" rows="4"></textarea>

            <!-- User Name -->
            <label for="username">Your Name (Optional)</label>
            <input type="text" id="username" name="username">

            <!-- Submit -->
            <input type="submit" value="Post Review">
        </form>

        <footer>
            <p><span id="currentyear"></span></p>
            <p><span id="lastModified"></span></p>
        </footer>
        
    </main>
    
</body>

</html>
